name: Android CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 拉取仓库
      uses: actions/checkout@main

    - name: 安装JDK
      uses: actions/setup-java@main
      with:
        java-version: latest
        distribution: temurin

    - name: 构建
      run: |
        chmod +x gradlew
        ./gradlew build

    - name: 上传构建结果
      uses: actions/upload-artifact@main
      with:
        name: output
        path: ./app/build/outputs/apk/*
